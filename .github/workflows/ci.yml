name: CI/CD
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
env:
  AID_DATABASE_NAME: aid_test
  AID_DATABASE_USERNAME: aid_test
  AID_DATABASE_PASSWORD: aid_test
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ${{ env.AID_DATABASE_NAME }}
          POSTGRES_USER: ${{ env.AID_DATABASE_USERNAME }}
          POSTGRES_PASSWORD: ${{ env.AID_DATABASE_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aid_test -d aid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Check formatting
        run: ./gradlew spotlessCheck
      - name: Run linter
        run: ./gradlew checkstyleMain checkstyleTest
      - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE: test
          AID_DATABASE_URL: jdbc:postgresql://localhost:5432/${{ env.AID_DATABASE_NAME }}
        run: ./gradlew test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -f --max-time 30 "${{ secrets.RENDER_DEPLOY_HOOK }}"